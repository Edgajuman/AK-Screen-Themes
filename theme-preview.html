<body>
  <div id="root"></div>
  <script>
    const root=document.getElementById('root');
    const cssVars={app_bg:'app-bg',header_bg:'header-bg',panel_bg:'panel-bg',tab_bg:'tab-bg',tab_text:'tab-text',tab_text_active:'tab-text-active',focus:'focus',accent:'accent',accent_hover:'accent-hover',text:'text',text_dim:'text-dim',text_faint:'text-faint',icon:'icon',icon_active:'icon-active',hover:'hover',pressed:'pressed',field_bg:'field-bg',field_border:'field-border',separator:'separator',row_alt:'row-alt',row_selected:'row-selected',hot_text:'hot-text',tl_bg:'tl-bg',tl_track_bg:'tl-track-bg',tl_track_bg_alt:'tl-track-bg-alt',tl_header_bg:'tl-header-bg',tl_ruler_bg:'tl-ruler-bg',tl_ruler_tick:'tl-ruler-tick',tl_ruler_text:'tl-ruler-text',playhead:'playhead',in_out_shade:'in-out-shade',clip_selected_border:'clip-selected-border',render_red:'render-red',render_yellow:'render-yellow',render_green:'render-green',monitor_bg:'monitor-bg',timecode:'timecode',danger:'danger',guide:'guide',snap:'snap',safe_margin:'safe-margin',graph_bg:'graph-bg',graph_grid:'graph-grid',graph_curve:'graph-curve',graph_velocity:'graph-velocity',graph_handle:'graph-handle',keyframe:'keyframe'};
    const panelNames={Project:'Project',MediaBrowser:'Media Browser',Libraries:'Libraries',Info:'Info',Effects:'Effects',Markers:'Markers',History:'History',Source:'Source',EffectControls:'Effect Controls',AudioClipMixer:'Audio Clip Mixer',Metadata:'Metadata',Program:'Program',Timeline:'Timeline',Tools:'Tools',AudioMeters:'Audio Meters',AudioTrackMixer:'Audio Track Mixer',LumetriColor:'Lumetri Color',LumetriScopes:'Lumetri Scopes',EssentialGraphics:'Essential Graphics',EssentialSound:'Essential Sound',Properties:'Properties',Text:'Text',Events:'Events',Progress:'Progress',ReferenceMonitor:'Reference Monitor',Timecode:'Timecode',Camera:'Camera',Extensions:'Widgets'};
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    function tabNode(node,path){return node&&node.Tabs?node.Tabs:null;}
    function splitCss(split){const vertical=Boolean(split.vertical),size=split.size||{Ratio:.5},kind=Object.keys(size)[0]||'Ratio',value=Number(size[kind])||.5;let tracks;if(kind==='Ratio'){const r=Math.min(.95,Math.max(.05,value));tracks=`minmax(0,${r}fr) minmax(0,${1-r}fr)`;}else if(kind==='FixedA'){tracks=`${value}px minmax(0,1fr)`;}else{tracks=`minmax(0,1fr) ${value}px`;}return {vertical,tracks};}
    function panelContent(panel){
      if(panel==='Source')return `<div class="monitor dock-content"><div class="monitor-image source-empty"><div class="empty-state">(no clips)</div></div><div class="transport"><span class="time">00:00:00:00</span><span>Fit ▾</span><span>1/2 ▾</span><span class="play">▶</span></div></div>`;if(panel==='Program')return `<div class="monitor dock-content"><div class="monitor-image"><span class="source-overlay">AK Screen Demo · Main Edit</span></div><div class="transport"><span class="time">00:00:04:06</span><span>Fit ▾</span><span>1/2 ▾</span><span class="play" data-icon="Play">▶</span><span>◀　▸　▶</span></div></div>`;
      if(panel==='Project'||panel==='MediaBrowser'||panel==='Libraries')return `<div class="dock-content"><div class="mini-row muted"><span>▱</span> AK Screen Demo.fcproj <span style="margin-left:auto">18 items</span></div><div class="input" style="margin-top:5px">⌕ &nbsp; Search</div><div class="folder-grid"><div class="folder-tile"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13l4 4h17v18H3zM3 8V4h12l4 4"/></svg><label>Footage</label><small>6 items</small></div><div class="folder-tile"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13l4 4h17v18H3zM3 8V4h12l4 4"/></svg><label>Audio</label><small>1 item</small></div><div class="folder-tile"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13l4 4h17v18H3zM3 8V4h12l4 4"/></svg><label>Graphics</label><small>3 items</small></div><div class="folder-tile"><svg viewBox="0 0 40 34" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8h13l4 4h17v18H3zM3 8V4h12l4 4"/></svg><label>Sequences</label><small>2 items</small></div></div><div class="media-thumbs"><div style="flex:1"><div class="media-thumb"></div><div class="media-name">Ocean_Sunset</div></div><div style="flex:1"><div class="media-thumb wave"></div><div class="media-name">Aurora_Edit</div></div></div></div>`;
      if(panel==='Timeline')return `<div class="dock-content timeline"><div class="timeline-toolbar"><strong>Main Edit</strong><span>⌖　◇　▤</span><span class="timeline-time">00:00:04:06</span><span>＋</span></div><div class="ruler"><span>00:00</span><span>00:05</span><span>00:10</span><span>00:15</span><span>00:20</span><span>00:25</span></div><div class="tracks"><div class="track"><span class="track-label">V1</span><span class="clip video">Ocean_Sunset.mp4</span><span class="clip image">Title</span><span class="clip video wide">Aurora_Edit.mp4</span></div><div class="track"><span class="track-label">A1</span><span class="clip audio">Narration.wav</span><span class="clip audio" style="width:25%">Music.wav</span></div><i class="playhead"></i></div></div>`;
      if(panel==='Properties')return `<div class="dock-content"><div class="empty-state">Select a clip to see its properties</div></div>`;
      if(panel==='EffectControls')return `<div class="dock-content"><div class="mini-row"><b class="effect-title">▾ Motion</b><span class="faint" style="margin-left:auto">↻</span></div><div class="property-row"><span>Position</span><b>960　540</b></div><div class="property-row"><span>Scale</span><b>100.0</b></div><div class="property-row"><span>Rotation</span><b>0°</b></div><div class="mini-graph"><svg viewBox="0 0 180 50" preserveAspectRatio="none"><path d="M0 34 C36 33 47 12 79 12 S130 44 180 16" fill="none" stroke="var(--graph-curve)" stroke-width="2"/><circle cx="80" cy="12" r="3" fill="var(--keyframe)"/><circle cx="137" cy="32" r="3" fill="var(--keyframe)"/></svg></div><div class="property-row"><span>Opacity</span><b>100%</b></div></div>`;
      if(panel==='Tools')return `<div class="dock-content"><div class="tools-list"><span class="tool">↖</span><span class="tool">⇥</span><span class="tool">✂</span><span class="tool">□</span><span class="tool">T</span><span class="tool">✥</span></div></div>`;
      if(panel==='AudioMeters')return `<div class="dock-content"><div class="meters"><i class="meter"></i><i class="meter"></i><i class="meter"></i></div></div>`;
      if(panel==='Effects')return `<div class="dock-content"><div class="input">⌕ &nbsp; Search Effects</div><div class="mini-row"><span class="dot"></span> Video Effects</div><div class="mini-row"><span class="dot" style="background:var(--accent-hover)"></span> Transitions</div><div class="mini-row"><span class="dot" style="background:var(--clip-audio)"></span> Audio Effects</div><div class="mini-row">Blur · Color · Transform</div></div>`;
      if(panel==='Text'||panel==='EssentialGraphics')return `<div class="dock-content"><div class="property-row"><span>Title</span><b>AK Screen</b></div><div class="property-row"><span>Font</span><b>Segoe UI</b></div><div class="property-row"><span>Size</span><b>48 px</b></div><div class="property-row"><span>Color</span><b>●　#FFFFFF</b></div></div>`;
      if(panel==='AudioMeters')return `<div class="dock-content"><div class="meters"><i class="meter"></i><i class="meter"></i></div></div>`;
      return `<div class="dock-content"><div class="mini-row"><span class="dot"></span>${esc(panelNames[panel]||panel)} panel</div><div class="property-row"><span>Status</span><b>Ready</b></div><div class="empty-state">${esc(panelNames[panel]||panel)}</div></div>`;
    }
    function renderNode(node,path='root'){
      if(node&&node.Tabs){const panels=Array.isArray(node.Tabs.panels)?node.Tabs.panels:[];if(!panels.length)return '<div class="dock-leaf"><div class="empty-state">Empty panel</div></div>';const compact=panels.length===1&&(panels[0]==='Tools'||panels[0]==='AudioMeters');const active=Math.max(0,Math.min(panels.length-1,Number(node.Tabs.active)||0));const tabs=panels.map((panel,i)=>`<button class="dock-tab${i===active?' active':''}" type="button" draggable="true" data-panel="${esc(panel)}" data-path="${esc(path)}">${esc(panelNames[panel]||panel)}</button>`).join('');return `<section class="dock-leaf panel${compact?' compact':''}" data-leaf-path="${esc(path)}"><div class="dock-tabs tabs" data-drop-path="${esc(path)}">${tabs}<button type="button" class="panel-menu button">☰</button></div>${panelContent(panels[active]).replaceAll('class="dock-content','class="dock-content text')}</section>`;}
      if(node&&node.Split){const s=node.Split,css=splitCss(s),axis=css.vertical?'vertical':'horizontal',handleClass=css.vertical?'vertical':'horizontal';const a=renderNode(s.a,path+'.a'),b=renderNode(s.b,path+'.b');return `<div class="dock-split" data-split-path="${esc(path)}" data-axis="${axis}" style="grid-template-${css.vertical?'rows':'columns'}:${css.tracks}">${a}<div class="split-handle ${handleClass}" data-handle-path="${esc(path)}" aria-label="Resize panel divider"></div>${b}</div>`;}
      return '<div class="dock-leaf"><div class="empty-state">Unsupported panel layout</div></div>';
    }
    function applyTheme(d){
      const mode=d.mode==='splash';window.__aksBackground=d.background||'';document.documentElement.style.cssText='';for(const[key,value]of Object.entries(d.colors||{})){if(cssVars[key]&&/^#[0-9a-f]{6}$/i.test(value))document.documentElement.style.setProperty('--'+cssVars[key],value);}for(const[key,value]of Object.entries(d.metrics||{})){if(!Number.isFinite(Number(value)))continue;const unit=['font_scale','animation_time'].includes(key)||key.includes('opacity')?'':'px';document.documentElement.style.setProperty('--'+key.replaceAll('_','-'),String(value)+unit);}for(const[key,value]of Object.entries(d.clips||{})){if(/^#[0-9a-f]{6}$/i.test(value))document.documentElement.style.setProperty('--clip-'+key.replaceAll('_','-'),value);}document.documentElement.style.setProperty('--surface-alpha',d.background?'88%':'100%');
      if(mode){root.innerHTML=`<main class="splash"><div class="splash-image"></div><div class="splash-card"><div class="splash-logo"><i>AK</i> Screen</div><div class="splash-bar"></div><div class="splash-caption">Preparando espacio de trabajo…</div></div></main>`;const splash=root.querySelector('.splash-image');if(splash&&d.splash)splash.style.backgroundImage=`url("${d.splash}")`;document.getElementById('theme-css').textContent=d.css||'';return;}
      root.innerHTML=`<div class="mock-app" id="editor"><div class="window-title"><span class="appmark">AK</span><span>AK Screen</span><div class="window-controls"><span>—</span><span>□</span><span>×</span></div></div><header class="toolbar"><div class="brand"><span class="brandmark">AK</span><span>AK Screen</span></div><nav class="main-nav menu"><span class="nav-item button">Import</span><span class="nav-item button active">Edición</span><span class="nav-item button">Exportar</span><span class="nav-item button">Menú</span><span class="nav-item button">Capturar</span><span class="nav-item button">Herramientas</span><span class="nav-item button">Configuración</span></nav><div class="project-title">AK Screen Demo</div><span class="theme-pill">Tema · ${esc(d.name||'AK Screen')}</span><div class="toolbar-actions"><span data-icon="Export">⇧</span><span data-icon="Bell">♧</span><span data-icon="Fullscreen">⛶</span></div></header><main class="dock-root"><div class="editor-bg"></div><div class="dock-tree">${renderNode(d.layout)}</div></main><footer class="footer"><span class="hint">Click to select, or click in empty space and drag to marquee select.</span><span class="status"><b>00:00:04:06</b>　Editing　│　100%</span></footer></div>`;
      const bg=root.querySelector('.editor-bg');if(bg&&d.background){bg.style.backgroundImage=`url("${d.background}")`;bg.style.opacity=String(d.backgroundOpacity??.38);}
      document.getElementById('theme-css').textContent=d.css||'';
      for(const[role,url]of Object.entries(d.icons||{})){if(!/^[A-Za-z][A-Za-z0-9]*$/.test(role))continue;root.querySelectorAll(`[data-icon="${role}"]`).forEach(target=>{const img=document.createElement('img');img.src=url;img.alt='';img.style.cssText='width:14px;height:14px;object-fit:contain';target.replaceChildren(img);});}
      const fontStyle=document.getElementById('theme-font');fontStyle.textContent=d.font?`@font-face{font-family:ThemeFont;src:url("${d.font}")}body{font-family:ThemeFont,"Segoe UI",Arial,sans-serif}`:'';
      bindPreviewInteractions();
    }
    function bindPreviewInteractions(){
      root.querySelectorAll('.dock-tab').forEach(tab=>{tab.addEventListener('click',()=>{const path=tab.dataset.path.split('.').slice(1);const leaf=path.reduce((n,key)=>n?.Split?.[key],window.__aksLayout);if(!leaf?.Tabs)return;leaf.Tabs.active=Array.from(tab.parentElement.querySelectorAll('.dock-tab')).indexOf(tab);window.parent.postMessage({type:'akscreen-layout-change',layout:window.__aksLayout},'*');});tab.addEventListener('dragstart',e=>{e.dataTransfer.setData('application/x-aks-panel',JSON.stringify({panel:tab.dataset.panel,path:tab.dataset.path}));});});
      root.querySelectorAll('.dock-tabs').forEach(tabs=>{tabs.addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('application/x-aks-panel')){e.preventDefault();tabs.classList.add('drag-target');}});tabs.addEventListener('dragleave',()=>tabs.classList.remove('drag-target'));tabs.addEventListener('drop',e=>{e.preventDefault();tabs.classList.remove('drag-target');try{const item=JSON.parse(e.dataTransfer.getData('application/x-aks-panel'));window.parent.postMessage({type:'akscreen-move-panel',panel:item.panel,from:item.path,to:tabs.dataset.dropPath},'*');}catch{}});});
      root.querySelectorAll('.split-handle').forEach(handle=>{handle.addEventListener('pointerdown',e=>{e.preventDefault();handle.setPointerCapture(e.pointerId);handle.classList.add('dragging');const split=handle.parentElement,path=handle.dataset.handlePath,vertical=split.dataset.axis==='vertical',rect=split.getBoundingClientRect(),size=window.__aksLayout,pieces=path.split('.').slice(1),node=pieces.reduce((n,key)=>n?.Split?.[key],size),axisStart=vertical?rect.top:rect.left,total=vertical?rect.height:rect.width;let lastRatio=.5;const move=ev=>{const p=(vertical?ev.clientY:ev.clientX)-axisStart;lastRatio=Math.max(.05,Math.min(.95,p/Math.max(1,total)));split.style[vertical?'gridTemplateRows':'gridTemplateColumns']=`minmax(0,${lastRatio}fr) minmax(0,${1-lastRatio}fr)`;};const up=()=>{node.Split.size={Ratio:lastRatio};handle.classList.remove('dragging');handle.removeEventListener('pointermove',move);window.parent.postMessage({type:'akscreen-layout-change',layout:size},'*');};handle.addEventListener('pointermove',move);handle.addEventListener('pointerup',up,{once:true});});});
    }
    function gradientPaint(ctx,value,x,y,w,h){
      const match=value.match(/linear-gradient\((.*)\)/i);if(!match)return false;
      const parts=[];let token='',depth=0;for(const ch of match[1]){if(ch==='(')depth++;if(ch===')')depth--;if(ch===','&&depth===0){parts.push(token.trim());token='';}else token+=ch;}if(token.trim())parts.push(token.trim());
      let angle=180;if(parts[0]&&/(?:deg|to )/i.test(parts[0])){const dir=parts.shift();if(dir.includes('deg'))angle=parseFloat(dir)||180;else angle=dir.includes('right')?90:dir.includes('left')?270:dir.includes('top')?0:180;}
      const radians=angle*Math.PI/180,length=Math.abs(Math.sin(radians))*w+Math.abs(Math.cos(radians))*h;
      const cx=x+w/2,cy=y+h/2,g=ctx.createLinearGradient(cx-Math.sin(radians)*length/2,cy+Math.cos(radians)*length/2,cx+Math.sin(radians)*length/2,cy-Math.cos(radians)*length/2);let stops=0;
      for(const part of parts){const color=part.match(/(?:#[0-9a-f]{3,8}|rgba?\\([^)]*\\)|hsla?\\([^)]*\\)|color\\([^)]*\\))/i);if(!color)continue;const pct=part.match(/(-?[\d.]+)%\s*$/),offset=pct?Math.max(0,Math.min(1,Number(pct[1])/100)):stops/Math.max(1,parts.length-1);try{g.addColorStop(offset,color[0]);stops++;}catch{}}
      if(stops<2)return false;ctx.fillStyle=g;ctx.fillRect(x,y,w,h);return true;
    }
    async function capturePng(){
      await document.fonts.ready;const width=1366,height=768,canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Canvas no disponible.');
      const app=root.querySelector('.mock-app')||root,origin=app.getBoundingClientRect(),items=[app,...app.querySelectorAll('*')];
      const imageFor=src=>new Promise(resolve=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>resolve(null);image.src=src;});
      for(const element of items){const style=getComputedStyle(element),rect=element.getBoundingClientRect();if(style.display==='none'||style.visibility==='hidden'||rect.width<=0||rect.height<=0)continue;const x=rect.left-origin.left,y=rect.top-origin.top,w=rect.width,h=rect.height;if(x+w<0||y+h<0||x>width||y>height)continue;ctx.save();ctx.globalAlpha=Number(style.opacity)||0;
        if(element.classList.contains('editor-bg')&&window.__aksBackground){const image=await imageFor(window.__aksBackground);if(image){const scale=Math.max(w/image.width,h/image.height),dw=image.width*scale,dh=image.height*scale;ctx.drawImage(image,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}}
        else if(style.backgroundImage&&style.backgroundImage!=='none'){if(!gradientPaint(ctx,style.backgroundImage,x,y,w,h)&&element instanceof HTMLImageElement&&element.complete)ctx.drawImage(element,x,y,w,h);}
        else if(style.backgroundColor&&style.backgroundColor!=='rgba(0, 0, 0, 0)'&&style.backgroundColor!=='transparent'){ctx.fillStyle=style.backgroundColor;ctx.fillRect(x,y,w,h);}
        const border=parseFloat(style.borderTopWidth)||0;if(border>0&&style.borderTopStyle!=='none'){ctx.strokeStyle=style.borderTopColor;ctx.lineWidth=border;ctx.strokeRect(x+border/2,y+border/2,Math.max(0,w-border),Math.max(0,h-border));}
        if(element.classList.contains('monitor-image')&&!element.classList.contains('source-empty')){ctx.fillStyle='#fff2c8';ctx.beginPath();ctx.arc(x+w/2,y+h*.53,Math.max(7,Math.min(w,h)*.055),0,Math.PI*2);ctx.fill();ctx.save();ctx.globalAlpha=.45;const reflection=ctx.createLinearGradient(x+w/2,y+h*.59,x+w/2,y+h*.97);reflection.addColorStop(0,'#ffe1a0');reflection.addColorStop(1,'transparent');ctx.fillStyle=reflection;ctx.fillRect(x+w*.43,y+h*.59,w*.14,h*.38);ctx.restore();}
        if(element instanceof HTMLImageElement&&element.complete&&element.naturalWidth){try{ctx.drawImage(element,x,y,w,h);}catch{}}
        if(element.namespaceURI==='http://www.w3.org/2000/svg'){try{const svg=new XMLSerializer().serializeToString(element),image=await imageFor('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));if(image)ctx.drawImage(image,x,y,w,h);}catch{}}
        for(const child of element.childNodes){if(child.nodeType!==Node.TEXT_NODE||!child.textContent.trim())continue;const range=document.createRange();range.selectNodeContents(child);const textRect=range.getBoundingClientRect();if(!textRect.width||!textRect.height)continue;ctx.fillStyle=style.color;ctx.font=`${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;ctx.textBaseline='alphabetic';ctx.textAlign=style.textAlign==='center'?'center':style.textAlign==='right'?'right':'left';let tx=textRect.left-origin.left;if(ctx.textAlign==='center')tx+=textRect.width/2;else if(ctx.textAlign==='right')tx+=textRect.width;ctx.fillText(child.textContent.trim(),tx,textRect.top-origin.top+textRect.height*.78,Math.max(2,textRect.width));}
        ctx.restore();
      }
      return canvas.toDataURL('image/png');
    }
    window.addEventListener('message',event=>{if(event.source!==parent||!event.data)return;if(event.data.type==='akscreen-theme'){window.__aksLayout=structuredClone(event.data.layout);applyTheme(event.data);}else if(event.data.type==='akscreen-capture'){capturePng().then(dataUrl=>parent.postMessage({type:'akscreen-capture-result',dataUrl},'*')).catch(error=>parent.postMessage({type:'akscreen-capture-result',error:String(error)},'*'));}});
    parent.postMessage({type:'akscreen-preview-ready'},'*');
  </script>
