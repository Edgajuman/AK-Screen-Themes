<script>

  const cssVars={app_bg:'app-bg',header_bg:'header-bg',panel_bg:'panel-bg',tab_bg:'tab-bg',tab_text:'tab-text',tab_text_active:'tab-text-active',focus:'focus',accent:'accent',accent_hover:'accent-hover',text:'text',text_dim:'text-dim',text_faint:'text-faint',icon:'icon',icon_active:'icon-active',hover:'hover',pressed:'pressed',field_bg:'field-bg',field_border:'field-border',separator:'separator',row_alt:'row-alt',row_selected:'row-selected',hot_text:'hot-text',tl_bg:'tl-bg',tl_track_bg:'tl-track-bg',tl_track_bg_alt:'tl-track-bg-alt',tl_header_bg:'tl-header-bg',tl_ruler_bg:'tl-ruler-bg',tl_ruler_tick:'tl-ruler-tick',tl_ruler_text:'tl-ruler-text',playhead:'playhead',in_out_shade:'in-out-shade',clip_selected_border:'clip-selected-border',render_red:'render-red',render_yellow:'render-yellow',render_green:'render-green',monitor_bg:'monitor-bg',timecode:'timecode',danger:'danger',guide:'guide',snap:'snap',safe_margin:'safe-margin',graph_bg:'graph-bg',graph_grid:'graph-grid',graph_curve:'graph-curve',graph_velocity:'graph-velocity',graph_handle:'graph-handle',keyframe:'keyframe'};
  function applyTheme(d){const mode=d.mode==='splash';root.innerHTML=mode?splashMarkup:editorMarkup;const cssRoot=document.documentElement;for(const[key,value]of Object.entries(d.colors||{})){if(cssVars[key])cssRoot.style.setProperty('--'+cssVars[key],value)}for(const[key,value]of Object.entries(d.metrics||{})){const unit=['font_scale','animation_time'].includes(key)||key.includes('opacity')?'':'px';cssRoot.style.setProperty('--'+key.replaceAll('_','-'),String(value)+unit)}for(const[key,value]of Object.entries(d.clips||{}))cssRoot.style.setProperty('--clip-'+key.replaceAll('_','-'),value);
    const r=d.ratios||{},left=Math.round((r.left||.33)*100),center=Math.round((r.center||.65)*(1-(r.left||.33))*100),right=Math.max(1,100-left-center),upper=Math.round((r.vertical||.58)*100),lower=100-upper,project=Math.round((r.project||.28)*100),remaining=100-project,timeline=Math.round(remaining*(r.timeline||.91)),meters=Math.max(1,remaining-timeline);for(const[key,value]of Object.entries({left:left+'fr',center:center+'fr',right:right+'fr',project:project+'fr','tool-width':Math.round(r.tools||64)+'px',timeline:timeline+'fr',meters:meters+'fr',upper:upper+'fr',lower:lower+'fr'}))root.style.setProperty('--'+key,value);

  }
